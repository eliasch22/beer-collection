<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer Collection</title>
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="description" content="Persönliches Bier-Tagebuch: bewerten, sammeln, Erfolge.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface-2:#E2E7DF; --ink:#16211B; --muted:#5D6C63; --line:#D2D9CE;
  --gold:#E2A11B; --gold-soft:#F7E2AE; --gold-ink:#3B2700; --hop:#2D6849; --danger:#B23E2E;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18201B; --surface-2:#243029; --ink:#E6ECE7; --muted:#93A399; --line:#2E3A32;
    --gold:#F0B43A; --gold-soft:#4A3810; --gold-ink:#FBE3A8; --hop:#6FBF92; --danger:#E2705F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201B; --surface-2:#243029; --ink:#E6ECE7; --muted:#93A399; --line:#2E3A32;
  --gold:#F0B43A; --gold-soft:#4A3810; --gold-ink:#FBE3A8; --hop:#6FBF92; --danger:#E2705F; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.shell{display:flex;flex-direction:column;height:100%}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.app{max-width:760px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 0 6px}
.title{font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:-0.025em;line-height:.95;margin:0;font-variation-settings:"opsz" 96}
.sub{color:var(--muted);margin:8px 0 0;font-size:15px}
.iconbtn{background:none;border:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.sm{width:36px;height:36px;color:var(--muted)}
.iconbtn.warn{background:var(--danger);color:#fff}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;padding:10px 0;margin:4px 0 4px}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{resize:vertical;min-height:90px}
.tools select{width:auto;flex:0 0 auto}
.tools .iconbtn{border:1.5px solid var(--line);background:var(--surface);width:46px;height:auto}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 8px 6px 13px;font-size:14px;margin-bottom:12px}
.fchip span{opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;border:0;padding:0;text-align:left;display:block;width:100%}
.ph{aspect-ratio:3/4;background:var(--surface-2);display:block;width:100%;object-fit:cover}
.ph.empty{display:grid;place-items:center}
.meta{padding:9px 11px 11px}
.nm{font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:13px;color:var(--muted)}
.rc{background:var(--gold-soft);color:var(--gold-ink);font-weight:700;border-radius:999px;padding:1px 8px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{margin-left:auto;font-size:17px;line-height:1}
.si{display:inline-block;vertical-align:middle;flex:0 0 auto;color:var(--ink)}
.list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:8px 12px 8px 8px;width:100%;text-align:left}
.li img,.li .ph{width:54px;height:72px;border-radius:10px;object-fit:cover;flex:0 0 auto;aspect-ratio:auto}
.li .tx{flex:1;min-width:0}
.li b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.li small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;margin-top:2px}
.li small span{overflow:hidden;text-overflow:ellipsis}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);z-index:20}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] svg{color:var(--gold)}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;background:var(--gold);color:var(--gold-ink);border:0;box-shadow:0 8px 22px rgba(140,90,0,.35);display:grid;place-items:center;z-index:21}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ov,.sheet{animation:none}}
.ov-bar{position:sticky;top:0;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.ov-bar h2{flex:1;margin:0 0 0 4px;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-body{max-width:760px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--gold);color:var(--gold-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid currentColor}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:4}
.savebar .in{max-width:728px;margin:0 auto;display:flex;gap:10px}
.savebar .btn{flex:1}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:up .2s ease-out}
.sheet .opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:14px}
.sheet .opt b{display:block;font-size:17px}
.sheet .opt small{color:var(--muted);font-size:14px}
.sheet .opt .oi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);flex:0 0 auto}
.picker{max-height:82%;display:flex;flex-direction:column;gap:10px}
.picker h3{margin:0;font-size:18px}
.picker .pl{overflow-y:auto;margin:0 -16px;padding:0 16px;flex:1;min-height:0}
.po{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;min-height:50px}
.po .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po small{color:var(--muted);font-size:13.5px;white-space:nowrap}
.po[aria-selected="true"]{font-weight:700}
.po[aria-selected="true"]::after{content:"✓";color:var(--gold);font-weight:800}
.po.new{color:var(--hop);font-weight:700}
.sw-dot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:1.5px solid rgba(0,0,0,.12)}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:13.5px;color:var(--muted);margin:0 0 5px 2px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:47px}
.pick .pv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pv.ph0{color:var(--muted)}
.pick::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:0 0 auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.slot{aspect-ratio:3/4;border-radius:12px;background:var(--surface);position:relative;overflow:hidden;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 13px;font-size:14.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.muted{background:var(--surface-2);color:var(--ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 1s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.stars{display:flex;gap:4px;justify-content:center;margin:6px 0 18px}
.sw{position:relative;display:inline-block}
.sw .h{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0}
.sw .h.l{left:0}.sw .h.r{right:0}
.st{display:block}
.st path{stroke:var(--gold);stroke-width:1.4;stroke-linejoin:round}
.st.full path{fill:var(--gold)}
.st.half path{fill:url(#hg)}
.st.empty path{fill:transparent}
.hg1{stop-color:var(--gold)}.hg2{stop-color:transparent}
.dup{font-size:14px;color:var(--hop);margin:-8px 0 12px 2px}
.stepper{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:46px;font-size:20px;font-weight:700}
.stepper input{border:0;border-radius:0;width:56px;text-align:center;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
details.more{border-top:1px solid var(--line);margin:6px 0 14px;padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;margin-bottom:12px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary small{font-weight:400;color:var(--muted);margin-right:auto}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
details.more[open] summary::after{content:"\2212"}
.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0}
.dots button.on{background:var(--hop);border-color:var(--hop)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -16px 6px;padding:0 16px}
.gal img{flex:0 0 100%;max-height:62vh;aspect-ratio:3/4;object-fit:cover;border-radius:18px;scroll-snap-align:center;background:var(--surface-2)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:9px 18px;margin:0 0 18px;background:var(--surface);border-radius:16px;padding:16px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:7px}
.notes{background:var(--surface);border-radius:16px;padding:14px 16px;white-space:pre-wrap;margin-bottom:18px}
.radar{background:var(--surface);border-radius:16px;padding:8px;margin-bottom:18px;display:flex;justify-content:center}
.radar svg{width:100%;max-width:340px;height:auto}
.radar text{fill:var(--muted);font-size:12px;font-family:var(--font)}
h3.sec{font-size:18px;margin:22px 0 10px}
.acts{display:grid;gap:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.kpi{background:var(--surface);border-radius:14px;padding:12px 13px}
.kpi b{font-size:28px;font-weight:800;display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:18px -16px 6px;padding:0 16px 4px}
.seg button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.r{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.r .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.n{font-weight:700;font-variant-numeric:tabular-nums}
.avg{color:var(--muted);font-size:14px;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.r.un{color:var(--muted)}
.pts{background:var(--surface);border-radius:16px;padding:16px;margin:14px 0 6px}
.pts .bar{height:10px;border-radius:5px;margin-top:10px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.a{background:var(--surface);border-radius:14px;padding:13px 8px 11px;text-align:center}
.a.off{opacity:.45;filter:grayscale(1)}
.a{border:0;width:100%;font:inherit;color:inherit}
.a .ic{font-size:30px;line-height:1;display:flex;justify-content:center;min-height:34px;align-items:center}
.ah{margin:6px 0 0;font-weight:700}
.lcs{display:flex;flex-wrap:wrap;gap:6px}
.lc{background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13.5px}
.lcs.on .lc{background:var(--gold-soft);color:var(--gold-ink)}
.abc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.abc span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--surface);color:var(--muted);font-weight:700;font-size:18px;border:1.5px dashed var(--line)}
.abc span.on{background:var(--gold);color:var(--gold-ink);border:0}
.a .t{font-weight:700;font-size:14px;line-height:1.2;margin-top:6px}
.a .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.25}
.a .p{font-size:12px;color:var(--ink);margin-top:4px;font-weight:600}
.wish{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:10px}
.wish .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;gap:12px;align-items:center}
.wish img,.wish .ph{width:58px;height:76px;border-radius:10px;object-fit:cover;flex:0 0 auto;aspect-ratio:auto}
.wish .tx{min-width:0}
.wish .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish .tx small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish .go{flex:0 0 auto;border:0;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:9px 11px;font-weight:700;font-size:14px}
.set{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}
.set h3{margin:0 0 12px;font-size:17px}
.set p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.set .btns{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.hidden{display:none!important}
.ocr{display:block}
.ocr .tg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.ocr .tg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.ocr .tg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14.5px;font-weight:600}
.chips button:active{background:var(--gold-soft)}
.bk{display:flex;align-items:center;gap:10px;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14.5px}
.bk span{flex:1}
.bk button{border:0;background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.mapcard{background:var(--surface);border-radius:16px;padding:10px;margin:14px 0 6px}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapwrap path{stroke:var(--surface);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer}
.mapwrap path.sel{stroke:var(--ink);stroke-width:1.6}
.m0{fill:var(--surface-2)}.m1{fill:#F4DB94}.m2{fill:#EDBF4F}.m3{fill:#E09C17}.m4{fill:#BC740C}.m5{fill:#874F05}
.mapwrap circle{stroke:var(--surface);stroke-width:1;vector-effect:non-scaling-stroke}
.regions{display:flex;gap:6px;overflow-x:auto;margin:10px -10px 4px;padding:0 10px 2px}
.regions button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.regions button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 2px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mapinfo{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:15px}
.mapinfo .tx{flex:1;min-width:0}
.mapinfo small{color:var(--muted);display:block}
.mapinfo .btn{padding:9px 13px;font-size:14px}
.chart{background:var(--surface);border-radius:16px;padding:14px 10px 10px;margin:14px 0 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.cb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;min-width:0;height:100%}
.cb .cbw{height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.cb .cv{font-weight:800;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:4px}

/* Barcode lokal auf dem Gerät lesen: zuerst eingebaute Erkennung, sonst ZXing */
async function decodeBarcode(blob){
  const ok = v => { const c = normEan(v); return eanCheck(c) ? c : ""; };
  if ("BarcodeDetector" in window) {
    try {
      const det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
      const bmp = await createImageBitmap(blob);
      const r = await det.detect(bmp);
      for (const x of r) { const c = ok(x.rawValue); if (c) return c; }
    } catch(e){}
  }
  try {
    const Z = await loadZXing();
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const img = await loadImg(blob);
    const W = img.width, H = img.height, base = Math.min(1, 1400 / Math.max(W, H));
    const tiles = [[0,0,1,1]];
    for (let r = 0; r < 4; r++) for (const c of [0, 0.2, 0.45]) tiles.push([c, r*0.22, 0.55, 0.34]);
    for (let r = 0; r < 6; r++) for (const c of [0, 0.3, 0.6]) tiles.push([c, r*0.15, 0.4, 0.22]);
    const cv = document.createElement("canvas"), ctx = cv.getContext("2d", {willReadFrequently:true});
    for (const [x, y, w, h] of tiles) for (const k of [1, 1.6]) {
      const sx = x*W, sy = y*H, sw = Math.min(w, 1-x)*W, sh = Math.min(h, 1-y)*H;
      const sc = Math.min(base * k, 1600 / Math.max(sw, sh));
      cv.width = Math.max(1, Math.round(sw*sc)); cv.height = Math.max(1, Math.round(sh*sc));
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data, lum = new Uint8ClampedArray(cv.width*cv.height);
      for (let i = 0, j = 0; i < lum.length; i++, j += 4) lum[i] = (d[j]*299 + d[j+1]*587 + d[j+2]*114) / 1000;
      const src = new Z.RGBLuminanceSource(lum, cv.width, cv.height);
      for (const Bn of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
        try { const rd = new Z.MultiFormatReader(); rd.setHints(hints); const c = ok(rd.decode(new Z.BinaryBitmap(new Bn(src))).getText()); if (c) return c; } catch(e){}
      }
      await new Promise(r => setTimeout(r, 0));
    }
  } catch(e){}
  return "";
}

function idbReq(store, mode, fn){

}

async function idbStore(){
  const keys = await idbReq("docs", "readonly", s => s.getAllKeys());
  const vals = await idbReq("docs", "readonly", s => s.getAll());
  const docs = {}; keys.forEach((k, i) => docs[k] = vals[i]);
  let cb = null;
  const all = () => Object.entries(docs).map(([id, d]) => ({...d, id}));
  return {
    mode:"device",
    subscribe(f){ cb = f; f(all()); },
    async save(id, d){ await idbReq("docs", "readwrite", s => s.put(d, id)); docs[id] = d; cb && cb(all()); },
    async remove(id){ await idbReq("docs", "readwrite", s => s.delete(id)); delete docs[id]; cb && cb(all()); }

  if (share && navigator.canShare) {
    const file = new File([blob], filename, {type});
    if (navigator.canShare({files:[file]})) { try { await navigator.share({files:[file], title:filename}); return {status:"delivered"}; } catch(e){ if (e && e.name === "AbortError") throw {code:"declined"}; } }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return {status:"saved"};
}

function localStore(){
  const LS = "beers.v1";
  let docs = {}; try { docs = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch(e){ docs = {}; }
  let cb = null;
  const all = () => Object.entries(docs).map(([id, d]) => ({...d, id}));
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify(docs)); } catch(e){ toast(tr("Lokaler Speicher ist voll. Exportiere deine Daten.")); } };
  return {
    mode:"local",
    subscribe(f){ cb = f; f(all()); },
    async save(id, d){ docs[id] = d; persist(); cb && cb(all()); },
    async remove(id){ delete docs[id]; persist(); cb && cb(all()); }
  };
}
function dbStore(db, uid){
  const col = db.collection("data/users/" + uid);
  return {
    mode:"db",
    subscribe(f){
      return col.limit(1000).onSnapshot(
        snap => f(snap.docs.map(d => ({...d.data(), id:d.id}))),
        () => toast(tr("Verbindung zur Datenbank unterbrochen. Seite neu laden."))
      );
    },
    save:(id, d) => col.doc(id).set(d),
    remove:id => col.doc(id).delete()
  };
}

async function loadImg(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e){} }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; });
}
async function compress(file, max = 1280, q = 0.82){
  const img = await loadImg(file);
  const w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}

function keyOf(b, f){
  if (f === "country") return b.country || "";
  if (f === "year") return (b.date || "").slice(0,4);
  if (f === "rating") return b.rating > 0 ? b.rating.toFixed(1) : "";
  if (f === "family") return styleFam(b.style) || "";
  return keyText(b[f]);
}
function labelOf(f, k, sample){
  if (f === "country") return `${flag(k)} ${esc(cName(k))}`;
  if (f === "rating") return tr("{n} Sterne",{n:k});
  if (f === "year") return k;
  if (f === "family") return `${famIcon(k, 20)} ${esc(FAM[k].n)}`;
  if (f === "style") return `${styleIcon(sample.style, 20)} ${esc(norm(sample.style))}`;
  return esc(norm(sample[f]));
}
function group(f){
  const m = new Map(); let un = 0;
  for (const b of S.beers) {
    const k = keyOf(b, f);
    if (!k) { un++; continue; }
    if (!m.has(k)) m.set(k, {k, n:0, sum:0, rn:0, sample:b});
    const g = m.get(k); g.n++; if (b.rating > 0) { g.sum += b.rating; g.rn++; }
  }
  const arr = [...m.values()];
  if (f === "year" || f === "rating") arr.sort((a,b) => b.k.localeCompare(a.k));
  else arr.sort((a,b) => b.n - a.n || (b.rn ? b.sum/b.rn : 0) - (a.rn ? a.sum/a.rn : 0));
  return {arr, un};
}
const distinct = f => new Set(S.beers.map(b => keyOf(b, f)).filter(Boolean)).size;
function firstDate(){ let f = null; for (const b of S.beers) if (b.date && (!f || b.date < f)) f = b.date; return f; }
function monthsSince(s){
  if (!s) return 0;
  const a = new Date(s), b = new Date();
  return Math.max(0, (b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth() - (b.getDate() < a.getDate() ? 1 : 0));
}

  }
  return m;
}

function contDetail(c, visited){
  const all = SOV[c].split(" ").sort((a,b) => cName(a).localeCompare(cName(b), LOCALE));
  const miss = all.filter(x => !visited.has(x)), have = all.filter(x => visited.has(x));
  const chips = l => l.map(x => `<span class="lc">${flag(x)} ${esc(cName(x))}</span>`).join("");
  return `${miss.length ? `<p class="ah">${tr("Fehlt noch ({n})",{n:miss.length})}</p><div class="lcs">${chips(miss)}</div>` : ""}${have.length ? `<p class="ah">${tr("Schon dabei ({n})",{n:have.length})}</p><div class="lcs on">${chips(have)}</div>` : ""}`;
}
function abcDetail(set){
  const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const miss = L.filter(x => !set.has(x));
  return `<div class="abc">${L.map(x => `<span class="${set.has(x) ? "on" : ""}">${x}</span>`).join("")}</div>
    <p class="ah">${miss.length ? tr("Fehlt noch: {l}",{l:miss.join(", ")}) : tr("Alle Buchstaben geschafft.")}</p>
    ${miss.length ? `<p style="margin:0;color:var(--muted);font-size:14px">${tr("Zählt den ersten Buchstaben des Biernamens. Umlaute zählen als Grundbuchstabe (Ä = A).")}</p>` : ""}`;
}
let ACH = [];
function achSheet(i){
  const a = ACH[i]; if (!a) return;
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  const pct = Math.min(100, a.have / a.need * 100);
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(a.t)}" style="max-height:82%;overflow-y:auto">
    <div style="display:flex;gap:14px;align-items:center"><div style="font-size:40px;line-height:1">${a.ic}</div><div><h3 style="margin:0;font-size:20px">${esc(a.t)}</h3><p style="margin:2px 0 0;color:var(--muted)">${esc(a.d || "")}</p></div></div>
    ${flavor(a) ? `<p style="margin:0;font-family:Georgia,serif;font-style:italic;font-size:16px;line-height:1.4">«${esc(flavor(a))}»</p>` : ""}
    <div><div style="display:flex;justify-content:space-between;font-size:14px"><span>${a.done ? tr("Freigeschaltet") : tr("{n} von {m}",{n:Math.min(a.have, a.need), m:a.need})}</span><b>${tr("{n} Pkt.",{n:a.pts})}</b></div><div class="bar" style="height:8px"><i style="width:${pct.toFixed(1)}%"></i></div></div>
    ${a.detail ? a.detail() : ""}
    <button class="btn pri block" data-a="share-ach" data-i="${i}">${ICON_SHARE} ${tr("Als Karte teilen")}</button></div>`;
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}
function achHTML(){

  const tot = L.reduce((s,a) => s + a.pts, 0), got = L.filter(a => a.done).reduce((s,a) => s + a.pts, 0);
  const cats = [...new Set(L.map(a => a.cat))];
  return `<header class="top"><div><h1 class="title">${tr("Erfolge")}</h1><p class="sub">${tr("{n} von {m} freigeschaltet",{n:L.filter(a=>a.done).length, m:L.length})}</p></div>${gearBtn}</header>
  <div class="pts"><b style="font-size:26px">${got}</b> <span style="color:var(--muted)">${tr("von {m} Punkten ({p} %)",{m:tot, p:Math.round(got/tot*100)})}</span><div class="bar"><i style="width:${(got/tot*100).toFixed(1)}%"></i></div></div>
  ${cats.map(c => `<h3 class="sec">${c}</h3><div class="ach">${L.map((a, i) => [a, i]).filter(([a]) => a.cat === c).map(([a, i]) => `<button class="a${a.done ? "" : " off"}" data-a="ach" data-i="${i}"><div class="ic">${a.ic}</div><div class="t">${esc(a.t)}</div>${a.d ? `<div class="d">${esc(a.d)}</div>` : ""}<div class="p">${a.done ? tr("{n} Pkt.",{n:a.pts}) : a.need > 1 ? `${Math.min(a.have,a.need)} / ${a.need}` : tr("{n} Pkt.",{n:a.pts})}</div></button>`).join("")}</div>`).join("")}`;
}

– you know beers that barely exist.","75 styles : tu connais des bières qui existent à peine.","75 stili: conosci birre che quasi non esistono.","75 estilos: conoces cervezas que casi no existen."],"s100":["Hundert Stile. Du bist kein Trinker, du bist Forscher.","A hundred styles. Not a drinker – a researcher.","Cent styles. Tu n'es pas buveur, tu es chercheur.","Cento stili. Non sei un bevitore, sei un ricercatore.","Cien estilos. No eres bebedor, eres investigador."],"br10":["Zehn Brauereien – die Tour hat begonnen.","Ten breweries – the tour has begun.","Dix brasseries : la tournée a commencé.","Dieci birrifici: il tour è iniziato.","Diez cervecerías: la gira ha empezado."],"br20":["Zwanzig Brauereien. Die Kessel dampfen für dich.","Twenty breweries. The kettles steam for you.","Vingt brasseries. Les cuves fument pour toi.","Venti birrifici. I tini fumano per te.","Veinte cervecerías. Las calderas humean por ti."],"br50":["Fünfzig Brauereien – ein Netzwerk aus Malz.","Fifty breweries – a network made of malt.","Cinquante brasseries : un réseau de malt.","Cinquanta birrifici: una rete di malto.","Cincuenta cervecerías: una red de malta."],"br100":["Hundert Brauereien. Brauer zeigen auf dich und flüstern.","A hundred breweries. Brewers point and whisper.","Cent brasseries. Les brasseurs te montrent du doigt.","Cento birrifici. I birrai ti indicano e bisbigliano.","Cien cervecerías. Los cerveceros te señalan y susurran."],"br150":["150 Brauereien – das Sudhaus ist dein Zuhause.","150 breweries – the brewhouse is your home.","150 brasseries : la salle de brassage est ta maison.","150 birrifici: la sala cottura è casa tua.","150 cervecerías: la sala de cocción es tu hogar."],"br250":["250 Brauereien. Hopfenbauern schicken dir Weihnachtskarten.","250 breweries. Hop farmers send you Christmas cards.","250 brasseries. Les houblonniers t'envoient leurs vœux.","250 birrifici. I coltivatori di luppolo ti fanno gli auguri.","250 cervecerías. Los lupuleros te felicitan la Navidad."],"br300":["300 Brauereien – wie die Spartaner, nur durstiger.","300 breweries – like the Spartans, only thirstier.","300 brasseries : comme les Spartiates, en plus assoiffé.","300 birrifici: come gli spartani, ma più assetato.","300 cervecerías: como los espartanos, pero con más sed."],"br350":["350 Brauereien. Die Braugilde tagt nicht mehr ohne dich.","350 breweries. The brewers' guild won't meet without you.","350 brasseries. La guilde des brasseurs t'attend.","350 birrifici. La gilda dei birrai non si riunisce senza di te.","350 cervecerías. El gremio cervecero no se reúne sin ti."],"br400":["400 Brauereien – dein Name steht in den Sudbüchern.","400 breweries – your name is in the brewing logs.","400 brasseries : ton nom figure dans les registres.","400 birrifici: il tuo nome è nei registri di cotta.","400 cervecerías: tu nombre está en los libros de cocción."],"br450":["450 Brauereien. Irgendwo wird ein Bier nach dir benannt.","450 breweries. Somewhere a beer is being named after you.","450 brasseries. Quelque part, une bière porte ton nom.","450 birrifici. Da qualche parte una birra porta il tuo nome.","450 cervecerías. En algún lugar, una cerveza lleva tu nombre."],"br500":["500 Brauereien. Gambrinus persönlich lädt zum Bankett.","500 breweries. Gambrinus himself invites you to the feast.","500 brasseries. Gambrinus en personne t'invite au banquet.","500 birrifici. Gambrinus in persona ti invita al banchetto.","500 cervecerías. El mismísimo Gambrinus te invita al banquete."],"m1":["Ein Monat Tagebuch – die Gewohnheit schäumt.","One month of journaling – the habit is foaming.","Un mois de carnet : l'habitude mousse.","Un mese di diario: l'abitudine fa schiuma.","Un mes de diario: el hábito hace espuma."],"m3":["Drei Monate. Aus einer Laune wird eine Chronik.","Three months. A whim has become a chronicle.","Trois mois. Un caprice devient une chronique.","Tre mesi. Un capriccio diventa una cronaca.","Tres meses. Un capricho se vuelve crónica."],"m6":["Ein halbes Jahr – Halbzeit, Prost!","Half a year – half-time, cheers!","Six mois : mi-temps, santé !","Sei mesi: metà tempo, cin cin!","Medio año: ¡descanso y salud!"],"m12":["Ein Jahr voller Biere. Happy Birthday, Sammlung!","A year full of beers. Happy birthday, collection!","Une année de bières. Joyeux anniversaire, collection !","Un anno di birre. Buon compleanno, collezione!","Un año de cervezas. ¡Feliz cumpleaños, colección!"],"m18":["18 Monate – deine Sammlung ist fast volljährig.","18 months – your collection is almost of age.","18 mois : ta collection est presque majeure.","18 mesi: la tua collezione è quasi maggiorenne.","18 meses: tu colección ya casi es mayor de edad."],"m24":["Zwei Jahre Treue. Das Bier dankt es dir.","Two years of loyalty. The beer thanks you.","Deux ans de fidélité. La bière te remercie.","Due anni di fedeltà. La birra ti ringrazia.","Dos años de fidelidad. La cerveza te lo agradece."],"m36":["Drei Jahre – ein Vermächtnis reift im Fass.","Three years – a legacy matures in the cask.","Trois ans : un héritage mûrit en fût.","Tre anni: un'eredità matura in botte.","Tres años: un legado madura en barrica."],"m60":["Fünf Jahre. Andere haben Hobbys, du hast eine Mission.","Five years. Others have hobbies, you have a mission.","Cinq ans. Les autres ont des loisirs, toi une mission.","Cinque anni. Gli altri hanno hobby, tu una missione.","Cinco años. Otros tienen aficiones, tú una misión."],"m120":["Zehn Jahre. Man wird Lieder über deine Sammlung singen.","Ten years. Songs will be sung about your collection.","Dix ans. On chantera des chansons sur ta collection.","Dieci anni. Si canteranno canzoni sulla tua collezione.","Diez años. Se cantarán canciones sobre tu colección."],"flager":["Klar, golden, ehrlich – das Lager ist dein Lagerfeuer.","Clear, golden, honest – lager is your campfire.","Claire, dorée, honnête : la lager est ton feu de camp.","Chiara, dorata, sincera: la lager è il tuo falò.","Clara, dorada, honesta: la lager es tu hoguera."],"fpils":["Kühl, herb, präzise – du fliegst im Pils-Cockpit.","Crisp, bitter, precise – you fly the pils cockpit.","Frais, amer, précis : tu pilotes le cockpit pils.","Fresca, amara, precisa: piloti la cabina pils.","Fresca, amarga, precisa: pilotas la cabina pils."],"fpale":["Blond, fruchtig, unwiderstehlich – ein Engel im Glas.","Blonde, fruity, irresistible – an angel in a glass.","Blonde, fruitée, irrésistible : un ange dans le verre.","Bionda, fruttata, irresistibile: un angelo nel bicchiere.","Rubia, afrutada, irresistible: un ángel en el vaso."],"fipa":["Mehr Hopfen als Blut in den Adern. Respekt.","More hops than blood in your veins. Respect.","Plus de houblon que de sang dans les veines. Respect.","Più luppolo che sangue nelle vene. Rispetto.","Más lúpulo que sangre en las venas. Respeto."],"famber":["Kupfer, Karamell, Charakter – ein echter Rotschopf.","Copper, caramel, character – a true redhead.","Cuivre, caramel, caractère : un vrai roux.","Rame, caramello, carattere: una vera testa rossa.","Cobre, caramelo, carácter: un auténtico pelirrojo."],"fdark":["Dunkel, malzig, geheimnisvoll – Bock auf mehr?","Dark, malty, mysterious – up for another?","Sombre, malté, mystérieux : encore une ?","Scura, maltata, misteriosa: ne vuoi ancora?","Oscura, maltosa, misteriosa: ¿otra más?"],"fstout":["Du hast die dunkle Seite gewählt. Sie hat Röstaromen.","You chose the dark side. It has roasted notes.","Tu as choisi le côté obscur. Il a des notes torréfiées.","Hai scelto il lato oscuro. Sa di tostato.","Elegiste el lado oscuro. Tiene notas tostadas."],"fwheat":["Trüb, spritzig, majestätisch – lang lebe der König!","Hazy, fizzy, majestic – long live the king!","Trouble, pétillante, majestueuse : vive le roi !","Torbida, frizzante, maestosa: lunga vita al re!","Turbia, chispeante, majestuosa: ¡larga vida al rey!"],"fbelgian":["Die Mönche haben gebetet – und du hast getrunken.","The monks prayed – and you drank.","Les moines ont prié, et toi, tu as bu.","I monaci hanno pregato, e tu hai bevuto.","Los monjes rezaron, y tú bebiste."],"fsour":["Das Leben gibt dir Zitronen? Du machst ein Sour daraus.","Life gives you lemons? You make a sour.","La vie te donne des citrons ? Tu en fais une sour.","La vita ti dà limoni? Tu ne fai una sour.","¿La vida te da limones? Tú haces una sour."],"fnonalc":["Null Promille, volle Punktzahl. Der Held am Steuer.","Zero alcohol, full marks. The hero behind the wheel.","Zéro alcool, note maximale. Le héros au volant.","Zero alcol, punteggio pieno. L'eroe al volante.","Cero alcohol, nota máxima. El héroe al volante."],"Feuchtfröhlich":["Fünf an einem Tag. Morgen wird ruhig. Vielleicht.","Five in one day. Tomorrow will be quiet. Maybe.","Cinq en un jour. Demain sera calme. Peut-être.","Cinque in un giorno. Domani sarà tranquillo. Forse.","Cinco en un día. Mañana será tranquilo. Quizá."],"Stil-Hopping":["Vier Stile an einem Tag – dein Gaumen fährt Achterbahn.","Four styles in a day – your palate rode a rollercoaster.","Quatre styles en un jour : ton palais fait du grand huit.","Quattro stili in un giorno: il palato sulle montagne russe.","Cuatro estilos en un día: tu paladar en la montaña rusa."],"Inselhüpfer":["Fünf Orte, sieben Tage, unzählige Fähren. Jamas!","Five places, seven days, countless ferries. Yamas!","Cinq lieux, sept jours, d'innombrables ferries. Yamas !","Cinque luoghi, sette giorni, infiniti traghetti. Yamas!","Cinco lugares, siete días, mil ferris. ¡Yamas!"],"Ferienmodus":["Out of Office: unterwegs in Sachen Bier.","Out of office: away on beer business.","Absent du bureau : en mission bière.","Fuori ufficio: in missione birraria.","Fuera de la oficina: de misión cervecera."],"Bier-ABC":["Von A bis Z – du buchstabierst Bier fliessend.","From A to Z – you spell beer fluently.","De A à Z : tu épelles la bière couramment.","Dalla A alla Z: compiti la birra alla perfezione.","De la A a la Z: deletreas cerveza con soltura."],"Treue Seele":["Fünfmal dasselbe Bier. Keine Gewohnheit – das ist Liebe.","Five times the same beer. That's not habit, that's love.","Cinq fois la même bière. Pas une habitude : de l'amour.","Cinque volte la stessa birra. Non è abitudine, è amore.","Cinco veces la misma cerveza. No es costumbre, es amor."],"Heimatliebe":["Die Welt ist gross, aber zu Hause schmeckt's am besten.","The world is big, but home tastes best.","Le monde est grand, mais rien ne vaut la bière de chez soi.","Il mondo è grande, ma a casa si beve meglio.","El mundo es grande, pero en casa sabe mejor."],"Stammgast":["Zehn Biere einer Brauerei – dein Stuhl ist reserviert.","Ten beers from one brewery – your stool is reserved.","Dix bières d'une brasserie : ton tabouret est réservé.","Dieci birre di un birrificio: lo sgabello è riservato.","Diez cervezas de una cervecería: tu taburete está reservado."],"Jahrgangsbester":["Fünfzig Biere in einem Jahr. Ein grosser Jahrgang!","Fifty beers in one year. A vintage year!","Cinquante bières en un an. Un grand millésime !","Cinquanta birre in un anno. Un'annata eccezionale!","Cincuenta cervezas en un año. ¡Una gran añada!"],"Fliegengewicht":["Leicht wie eine Feder, frisch wie ein Sommerregen.","Light as a feather, fresh as summer rain.","Légère comme une plume, fraîche comme une pluie d'été.","Leggera come una piuma, fresca come pioggia d'estate.","Ligera como una pluma, fresca como lluvia de verano."],"Schwergewicht":["Ab zehn Prozent wird's ernst. Du hast nicht gekniffen.","From ten percent it gets serious. You didn't flinch.","Dès dix pour cent, c'est sérieux. Tu n'as pas flanché.","Dal dieci per cento si fa sul serio. Non hai mollato.","Desde el diez por ciento va en serio. No te echaste atrás."],"Regenbogen":["Von Stroh bis Schwarz – du hast alle Farben getrunken.","From straw to black – you've drunk every colour.","De la paille au noir : tu as bu toutes les couleurs.","Dalla paglia al nero: hai bevuto tutti i colori.","De la paja al negro: has bebido todos los colores."],"Ganz okay":["25-mal drei Sterne. Die Schweiz der Bewertungen.","Three stars, 25 times. The Switzerland of ratings.","25 fois trois étoiles. La Suisse des notes.","25 volte tre stelle. La Svizzera delle valutazioni.","25 veces tres estrellas. La Suiza de las notas."],"Volle Punktzahl":["Fünfmal fünf Sterne – du hast den Bier-Olymp gesehen.","Five stars, five times – you've seen beer Olympus.","Cinq fois cinq étoiles : tu as vu l'Olympe de la bière.","Cinque volte cinque stelle: hai visto l'Olimpo della birra.","Cinco veces cinco estrellas: has visto el Olimpo cervecero."],"Feinschmecker":["Herb, malzig, fruchtig – deine Zunge ist ein Labor.","Bitter, malty, fruity – your tongue is a laboratory.","Amer, malté, fruité : ta langue est un laboratoire.","Amaro, maltato, fruttato: la tua lingua è un laboratorio.","Amarga, maltosa, afrutada: tu lengua es un laboratorio."],"Bierfotograf":["Hundert Biere fotografiert. Andere fotografieren ihr Essen.","A hundred beers photographed. Others shoot their food.","Cent bières en photo. D'autres photographient leur assiette.","Cento birre fotografate. Altri fotografano il cibo.","Cien cervezas fotografiadas. Otros fotografían su comida."],"Neujahrsbier":["Das Jahr beginnt, wie es sein soll: mit einem Bier.","The year begins as it should: with a beer.","L'année commence comme il se doit : avec une bière.","L'anno inizia come deve: con una birra.","El año empieza como debe: con una cerveza."],"Silvesterbier":["Das letzte Bier des Jahres – ein würdiger Abschluss.","The last beer of the year – a worthy finale.","La dernière bière de l'année : un final digne.","L'ultima birra dell'anno: un degno finale.","La última cerveza del año: un final digno."],"Freitag, der 13.":["Pech? Nicht mit einem vollen Glas in der Hand.","Bad luck? Not with a full glass in hand.","La poisse ? Pas avec un verre plein à la main.","Sfortuna? Non con un bicchiere pieno in mano.","¿Mala suerte? No con un vaso lleno en la mano."],"Das beste Bier":["Fünf Sterne. Manche Biere vergisst man nie.","Five stars. Some beers you never forget.","Cinq étoiles. Certaines bières ne s'oublient jamais.","Cinque stelle. Certe birre non si dimenticano mai.","Cinco estrellas. Hay cervezas que no se olvidan."],"Das schlechteste Bier":["Nicht jedes Abenteuer endet gut. Aber du hast überlebt.","Not every adventure ends well. But you survived.","Toute aventure ne finit pas bien. Mais tu as survécu.","Non tutte le avventure finiscono bene. Ma sei sopravvissuto.","No toda aventura acaba bien. Pero sobreviviste."],"Von der Merkliste":["Gemerkt, gesucht, gefunden, getrunken. Mission erfüllt.","Saved, sought, found, drunk. Mission accomplished.","Noté, cherché, trouvé, bu. Mission accomplie.","Annotata, cercata, trovata, bevuta. Missione compiuta.","Apuntada, buscada, encontrada, bebida. Misión cumplida."],"Abgehakt":["Zehn Wünsche erfüllt. Die Merkliste zittert vor dir.","Ten wishes granted. The wishlist trembles before you.","Dix vœux exaucés. La liste tremble devant toi.","Dieci desideri esauditi. L'elenco trema davanti a te.","Diez deseos cumplidos. La lista tiembla ante ti."]};
const flavor = a => { const f = a && FLAVOR[a.fx]; return f ? f[{de:0,en:1,fr:2,it:3,es:4}[LANG]] || f[0] : ""; };

/* ================= Teilen-Karten ================= */
const CK = {dark:"#3A2F26", line:"#B89B63", paper:"#F4EDE0", paper2:"#EAE0CC", edge:"#9C8255", ink:"#3A2F26", muted:"#6B5A40", art:"#EFE6D2", star:"#E8B84A", starEdge:"#5A4527"};
const RARITY = {common:["Gewöhnlich","#9C9888"], rare:["Selten","#6E8FA8"], epic:["Episch","#8A7BA8"], legend:["Legendär","#C29A3E"]};
const beerRarity = r => r >= 5 ? "legend" : r >= 4 ? "epic" : r >= 3 ? "rare" : "common";
const achRarity = p => p > 300 ? "legend" : p > 100 ? "epic" : p > 30 ? "rare" : "common";
const CSANS = '"Bricolage Grotesque", system-ui, -apple-system, Roboto, sans-serif', CSERIF = 'Georgia, "Times New Roman", serif';
function mixHex(a, b, t){ const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v*(1-t) + B[i]*t).toString(16).padStart(2, "0")).join(""); }
function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
function box(c, x, y, w, h, r, fill, stroke, lw = 1.2){ rrect(c, x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); } }
function fitText(c, t, max){ t = String(t || ""); if (c.measureText(t).width <= max) return t; while (t.length > 1 && c.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; }
function wrapText(c, t, max, lines){ const out = []; let cur = ""; for (const w of String(t).replace(/\s+/g, " ").trim().split(" ")) { const n = cur ? cur + " " + w : w; if (c.measureText(n).width <= max) cur = n; else { if (cur) out.push(cur); cur = w; } if (out.length === lines) break; } if (out.length < lines && cur) out.push(cur); if (out.length === lines && out.join(" ").length < t.trim().length) out[lines-1] = fitText(c, out[lines-1] + " …", max); return out; }
function drawGlass(c, fk, x, y, size){
  const f = FAM[fk] || FAM.other, g = GLASS[f.g];
  c.save(); c.translate(x, y); c.scale(size/24, size/24);
  const p = new Path2D(g.d);
  c.save(); c.clip(p); c.fillStyle = f.c; c.fillRect(0, 0, 24, 24); if (g.foam) { c.fillStyle = f.f || "#FFF6E0"; c.fillRect(0, 0, 24, g.top + g.foam); } c.restore();
  c.lineWidth = 1.3; c.strokeStyle = CK.ink; c.lineJoin = "round"; c.lineCap = "round"; c.stroke(p); if (g.extra) c.stroke(new Path2D(g.extra));
  c.restore();
}
function starPath(c, cx, cy, R){ const r = R*0.42; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r : R; c.lineTo(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr); } c.closePath(); }
function drawStars(c, v, cx, cy, R, gap){
  for (let i = 0; i < 5; i++) {
    const x = cx + (i - 2)*gap;
    starPath(c, x, cy, R); c.fillStyle = CK.paper; c.fill();
    if (v >= i + 0.5) { c.save(); starPath(c, x, cy, R); c.clip(); c.fillStyle = CK.star; c.fillRect(x - R, cy - R, v >= i + 1 ? 2*R : R, 2*R); c.restore(); }
    starPath(c, x, cy, R); c.lineWidth = 1; c.strokeStyle = CK.starEdge; c.lineJoin = "round"; c.stroke();
  }
}
function loadSrc(src){ return new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function drawCover(c, img, x, y, w, h){ const k = Math.max(w / img.width, h / img.height), sw = w / k, sh = h / k; c.drawImage(img, (img.width - sw)/2, (img.height - sh)/2, sw, sh, x, y, w, h); }
function table(c, rows, y){
  const h = rows.length * 20; box(c, 18, y, 264, h, 6, CK.paper, CK.edge);
  rows.forEach(([k, v], i) => {
    const ry = y + i*20;
    if (i % 2) { c.fillStyle = CK.paper2; c.fillRect(19, ry, 262, 20); }
    c.font = `400 12.5px ${CSANS}`; c.fillStyle = CK.muted; c.textAlign = "left"; c.fillText(k, 30, ry + 14);
    c.font = `600 12.5px ${CSANS}`; c.fillStyle = CK.ink; c.textAlign = "right"; c.fillText(fitText(c, v, 150), 270, ry + 14);
  });
  c.textAlign = "left"; return y + h;
}

function radarHTML(t){
  const vals = TASTE.map(([k]) => +(t && t[k]) || 0);
  if (vals.filter(v => v > 0).length < 3) {
    const rows = TASTE.filter(([k]) => t && t[k] > 0);
    if (!rows.length) return "";
    return `<div class="facts" style="grid-template-columns:max-content 1fr">${rows.map(([k,l]) => `<dt>${l}</dt><dd><span class="bar" style="flex:1;margin:0"><i style="width:${t[k]*20}%;background:var(--hop)"></i></span>${t[k]}/5</dd>`).join("")}</div>`;
  }
  const W = 320, H = 260, cx = W/2, cy = H/2, R = 88, N = TASTE.length;
  const pt = (i, r) => { const a = -Math.PI/2 + i * 2*Math.PI/N; return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; };
  const poly = r => TASTE.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(",")).join(" ");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr("Geschmacksprofil")}">`;
  for (let r = 1; r <= 5; r++) s += `<polygon points="${poly(R*r/5)}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  TASTE.forEach((_, i) => { const [x,y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; });
  s += `<polygon points="${vals.map((v,i) => pt(i, R*v/5).map(n => n.toFixed(1)).join(",")).join(" ")}" fill="var(--hop)" fill-opacity=".3" stroke="var(--hop)" stroke-width="2" stroke-linejoin="round"/>`;
  TASTE.forEach(([k,l], i) => { const [x,y] = pt(i, R + 20); const anc = Math.abs(x - cx) < 4 ? "middle" : x > cx ? "start" : "end"; s += `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}">${l}${vals[i] ? ` ${vals[i]}` : ""}</text>`; });
  return `<div class="radar">${s}</svg></div>`;
}

    let h = "";
    if (allowNew && q && !options.some(o => keyText(o.v) === q)) h += `<button class="po new" data-pv="${esc(inp.value.trim())}">＋ ${tr("«{v}» hinzufügen",{v:esc(inp.value.trim())})}</button>`;

/* Vollständiges Backup: beers.json + alle Fotos als ZIP (auch für den Umzug in die PWA) */
let jszipP = null;
function loadJSZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (!jszipP) jszipP = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "vendor/jszip.min.js";
    sc.onload = () => window.JSZip ? res(window.JSZip) : rej(new Error("jszip")); sc.onerror = () => { jszipP = null; rej(new Error("jszip")); };
    document.head.appendChild(sc);
  });
  return jszipP;
}
async function photoBlobById(p){
  if (isAssetId(p)) { const b = await getPhoto(p); if (b) return b; }
  const src = photoSrc(p);
  try { const r = await fetch(src); if (r.ok) { const b = await r.blob(); if (b.size) return b; } } catch(e){}
  return await new Promise(res => {
    const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext("2d").drawImage(im, 0, 0); c.toBlob(b => res(b), "image/jpeg", 0.9); };
    im.onerror = () => res(null); im.src = src;
  });
}

async function importZip(file){

const LEGACY_COUNTRY = {an:"CW", gb_sct:"GB-SCT", gb_eng:"GB-ENG", gb_wls:"GB-WLS", gb_nir:"GB-NIR", uk:"GB"};
const dec = s => { if (s == null) return ""; try { return decodeURIComponent(String(s).replace(/\+/g, " ")).trim(); } catch(e){ return String(s).trim(); } };
function legacySize(v){
  const n = num(v); if (!n) return "";
  const l = n <= 2 ? n : n < 10 ? n/10 : n < 100 ? n/100 : n/1000;
  return `${+l.toFixed(3)} l`;

function legState(t){ const e = document.querySelector("#legstate"); if (e) e.textContent = t; }

      const stem = imgs[0] ? imgs[0].replace(/\.[^.]+$/, "") : `${unix}-${t("name")}`;
      const id = ("L" + stem).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 120);
      if (exists.has(id)) { skip++; continue; }
      const cRaw = t("country").toLowerCase();

      const qty = parseInt(t("beerscount"));

      };
      if (!(await saveDoc(id, doc))) break;

/* Zeitstempel aus dem Dateinamen der alten App: BEER_JJJJMMTThhmmss.jpg */
function legacyTime(nm){
  const m = /BEER_(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(nm);
  return m ? new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
}
async function legacyPhotos(files){
  if (!CAP.assets) { toast(tr("Fotos können hier nicht gespeichert werden.")); return; }
  const imgs = files.filter(f => (f.type || "").startsWith("image/") || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
  const byName = new Map(imgs.map(f => [f.name, f]));
  const owners = [...S.beers, ...S.wishes].filter(b => (b.legacyImages || []).length);
  /* 1. exakter Dateiname, 2. Änderungszeit der Datei nahe am Aufnahmezeitpunkt (±3 Min.) */
  const assign = new Map();
  const usedFiles = new Set();
  for (const b of owners) for (const nm of b.legacyImages) if (byName.has(nm)) { assign.set(nm, byName.get(nm)); usedFiles.add(byName.get(nm)); }
  const rest = imgs.filter(f => !usedFiles.has(f) && f.lastModified);
  const pairs = [];
  for (const b of owners) for (const nm of b.legacyImages) {
    if (assign.has(nm)) continue;
    const t = legacyTime(nm); if (!t) continue;
    for (const f of rest) { const d = Math.abs(f.lastModified - t); if (d <= 180000) pairs.push([d, nm, f]); }
  }
  pairs.sort((a,b) => a[0] - b[0]);
  for (const [, nm, f] of pairs) if (!assign.has(nm) && !usedFiles.has(f)) { assign.set(nm, f); usedFiles.add(f); }
  const total = assign.size;
  if (!total) {
    legState(tr("Keines der {n} Fotos passt zu einem importierten Bier. Wähle die Fotos über den Dateimanager, damit Namen wie BEER_2026….jpg erhalten bleiben.",{n:imgs.length}));
    return;
  }
  let done = 0, stop = false; BUSY = true;
  try {
    for (const b of owners) {
      const fresh = [...S.beers, ...S.wishes].find(x => x.id === b.id) || b;
      const add = [], left = [];
      for (const nm of fresh.legacyImages || []) {
        const f = assign.get(nm);
        if (!f || stop) { left.push(nm); continue; }
        try {
          const blob = await compress(f, 1280, 0.8);
          add.push((await CAP.assets.upload(blob)).id); done++;
          legState(tr("Foto {n} von {m} hochgeladen …",{n:done, m:total}));
        } catch(e) {
          left.push(nm);
          if (e && (e.code === "quota_or_state" || e.code === "rate_limited")) stop = e.code;
        }
      }
      if (add.length) {
        const {id, ...doc} = fresh;
        doc.photos = [...(fresh.photos || []), ...add]; doc.legacyImages = left; doc.updatedAt = Date.now();
        await saveDoc(b.id, doc);
      }
      if (stop) break;
    }
  } finally { BUSY = false; }
  const pl = pendingLegacy();
  legState(stop === "quota_or_state" ? tr("Foto-Speicher ist voll. {n} Fotos hochgeladen.",{n:done})
    : stop === "rate_limited" ? tr("{n} Fotos hochgeladen. Zu viele Uploads auf einmal; wähle die Fotos in ein paar Minuten nochmals aus, bereits zugeordnete werden übersprungen.",{n:done})
    : tr("{n} Fotos zugeordnet.",{n:done}) + " " + (pl ? tr("{n} warten noch.",{n:pl}) : tr("Alle Fotos sind zugeordnet.")));
  renderT = setTimeout(render, 50);
}

  document.body.appendChild(bg);
}
let delArm = null;
const H = {
  tab(a){ S.tab = a.dataset.t; lastTab = null; render(); },
  open(a){ openDetail(a.dataset.id); },
  close(){ closeTop(); },
  settings(){ openOv(settingsHTML()); },
  view(){ S.view = S.view === "list" ? "grid" : "list"; LSset("beers.view", S.view); render(); },
  fab(){
    const wish = S.tab === "wishes";
    const bg = document.createElement("div"); bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${tr("Hinzufügen")}">
      ${CAP.images || CAP.ocr ? `<button class="opt" data-a="add-scan"><span class="oi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg></span><span><b>${tr("Etikett fotografieren")}</b><small>${tr("Vorder- und Rückseite; Alkohol, Grösse und Barcode werden lokal erkannt")}</small></span></button>` : ""}
      <button class="opt" data-a="add-barcode"><span class="oi">${ICON_BC}</span><span><b>${tr("Barcode scannen")}</b><small>${tr("Prüfen, ob du das Bier schon kennst")}</small></span></button>
      <button class="opt" data-a="add-manual"><span class="oi">${ICON_EDIT}</span><span><b>${tr("Manuell erfassen")}</b><small>${wish ? tr("Bier für die Merkliste eintragen") : tr("Alle Angaben selbst eingeben")}</small></span></button>
    </div>`;
    bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
    bg.dataset.kind = wish ? "wish" : "beer";
    document.body.appendChild(bg);
  },
  "add-manual"(a){ const bg = a.closest(".sheet-bg"); const k = bg.dataset.kind; bg.remove(); openForm(k); },
  "add-scan"(a){ const bg = a.closest(".sheet-bg"); pendingScan = {kind:bg.dataset.kind, inForm:false}; bg.remove(); const i = $("#pick-scan"); i.value = ""; i.click(); },
  "scan-btn"(){
    if (F.photos.length) { runScan(); return; }
    pendingScan = {kind:F.kind, inForm:true}; const i = $("#pick-scan"); i.value = ""; i.click();
  },
  "add-barcode"(a){ const bg = a.closest(".sheet-bg"); bcCtx = {kind:bg.dataset.kind, inForm:false}; bg.remove(); const i = $("#pick-barcode"); i.value = ""; i.click(); },
  "ean-scan"(){ bcCtx = {inForm:true}; const i = $("#pick-barcode"); i.value = ""; i.click(); },
  "bc-again"(a){ H.again(a); },
  "bc-new"(a){
    const kind = a.dataset.kind, ean = a.dataset.ean;
    if (a.dataset.mode === "scan") { pendingScan = {kind, inForm:false, prefill:{ean}}; const i = $("#pick-scan"); i.value = ""; i.click(); }
    else openForm(kind, null, {ean});
  },
  ach(a){ achSheet(+a.dataset.i); },
  "name-save"(){ const v = norm(document.querySelector("#welcome-name")?.value).slice(0, 30); saveSettings(v ? {userName:v, nameAsked:true} : {nameAsked:true}); },
  "name-later"(){ saveSettings({nameAsked:true}); },
  async "share-beer"(a){ const b = S.beers.find(x => x.id === a.dataset.id); if (b) cardPreview(await beerCard(b), `beer-collection-${norm(b.name).replace(/[^\p{L}\p{N}]+/gu, "-").toLowerCase() || "karte"}.png`); },
  async "share-ach"(a){ const x = ACH[+a.dataset.i]; if (x) cardPreview(await achCard(x), `beer-collection-erfolg-${norm(x.t).replace(/[^\p{L}\p{N}]+/gu, "-").toLowerCase()}.png`); },
  async "card-share"(){ const o = stack[stack.length - 1]; if (!o || !o.cardBlob) return; const file = new File([o.cardBlob], o.cardName, {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { try { await navigator.share({files:[file], title:"Beer Collection"}); } catch(e){} }
    else { await saveFile({filename:o.cardName, data:o.cardBlob}); toast(tr("Teilen ist auf diesem Gerät nicht möglich – die Karte wurde gespeichert.")); } },
  async "card-save"(){ const o = stack[stack.length - 1]; if (o && o.cardBlob) { await saveFile({filename:o.cardName, data:o.cardBlob}); toast(tr("Karte gespeichert")); } },
  "map-view"(a){ mapView = a.dataset.k; render(); },
  "map-tap"(a, e){ const t = e.target.closest("[data-mc]"); if (!t) return; mapSel = mapSel === t.dataset.mc ? null : t.dataset.mc; render(); },
  "map-show"(a){
    const k = a.dataset.c;
    S.filter = {field:"country", value:k, label:`${flag(k)} ${esc(cName(k))}`, title:tr("Länder")};
    S.q = ""; S.tab = "beers"; lastTab = null; render();
  },
  "photo-add"(){ const i = $("#pick-photo"); i.value = ""; i.click(); },
  "photo-rm"(a){ const p = F.photos.splice(+a.dataset.i, 1)[0]; if (p) { if (p.blob) URL.revokeObjectURL(p.src); else if (p.id) F.removed.push(p.id); } renderPhotos(); },
  star(a){ const v = +a.dataset.v; setStars(F.rating === v ? 0 : v); },
  taste(a){
    const k = a.dataset.t, v = +a.dataset.v;
    if (F.taste[k] === v) delete F.taste[k]; else F.taste[k] = v;
    a.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", (F.taste[k] || 0) >= +b.dataset.v));
    const tc = Object.values(F.taste).filter(x => x > 0).length;
    const sm = a.closest("details").querySelector("summary small"); if (sm) sm.textContent = tc ? tr("{n} von {m} bewertet",{n:tc, m:TASTE.length}) : tr("optional");
  },
  pick(a){
    const k = a.dataset.pk;
    openPicker({
      title: k === "place" && F.kind !== "beer" ? tr("Wo gesehen") : PICK_FIELDS[k],
      options: pickerOptions(k), value: F.p[k],
      allowNew: ["style","brewery","place"].includes(k), search: k !== "ebc",
      onPick: v => {
        F.touched.add(k); setPick(k, v);
        if (k === "brewery" && v && !F.touched.has("country")) {
          const e = usedValues("brewery").get(v.toLowerCase());
          const c = e && topCountry(e); if (c) setPick("country", c);
        }
      }
    });
  },
  qty(a){ const i = F.el.querySelector('[data-k="qty"]'); i.value = Math.max(1, (parseInt(i.value) || 1) + +a.dataset.d); },
  "save-form"(){ saveForm(); },
  edit(a){ openForm("beer", a.dataset.id); },
  async again(a){
    const b = S.beers.find(x => x.id === a.dataset.id); if (!b) return;
    const {id, ...doc} = b; doc.qty = (b.qty || 1) + 1; doc.updatedAt = Date.now();
    if (await saveDoc(b.id, doc)) toast(tr("{n}-mal getrunken",{n:doc.qty}));
  },
  async del(a){
    if (delArm !== a) {
      delArm = a; a.classList.add("warn"); toast(tr("Nochmals tippen zum Löschen"));
      setTimeout(() => { if (delArm === a) { delArm = null; a.classList.remove("warn"); } }, 4000); return;
    }
    delArm = null;
    const b = S.beers.find(x => x.id === a.dataset.id); if (!b) return;
    if (await removeDoc(b.id)) { await deleteAssets(b.photos); toast(tr("Bier gelöscht")); }
  },
  "wish-edit"(a){ openForm("wish", a.dataset.id); },
  "wish-drunk"(a){
    const w = S.wishes.find(x => x.id === a.dataset.id); if (!w) return;
    if (F && F.kind === "wish" && F.id === w.id) closeTop();
    openForm("beer", null, {name:w.name, brewery:w.brewery, style:w.style, country:w.country, notes:w.notes, photos:w.photos || [], _fromWish:w.id});
  },
  async "wish-del"(a){
    if (delArm !== a) { delArm = a; a.classList.add("warn"); toast(tr("Nochmals tippen zum Löschen")); return; }
    delArm = null;
    const w = S.wishes.find(x => x.id === a.dataset.id); if (!w) return;
    if (await removeDoc(w.id)) { await deleteAssets(w.photos); closeTop(); toast(tr("Von der Merkliste entfernt")); }
  },
  "clear-filter"(){ S.filter = null; render(); },
  "stat-tab"(a){ S.statTab = a.dataset.k; render(); },
  "stat-row"(a){
    const f = S.statTab, k = a.dataset.k, g = group(f).arr.find(x => x.k === k);
    S.filter = {field:f, value:k, label:labelOf(f, k, g ? g.sample : {}), title:STAT_TABS.find(t => t[0] === f)[1]};
    S.q = ""; S.tab = "beers"; lastTab = null; render();
  },
  "show-nophoto"(){ S.filter = {field:"_nophoto", label:tr("Fotos fehlen"), title:tr("Filter")}; S.q = ""; S.tab = "beers"; lastTab = null; closeTop(); render(); },
  theme(a){ LSset("beers.theme", a.dataset.k); applyTheme(); a.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === a)); },
  export(){ doExport(); },
  lang(a){ LSset("beers.lang", a.dataset.k); location.reload(); },
  "export-zip"(){ ZIP_SHARE = false; doExportZip(); },
  "share-zip"(){ ZIP_SHARE = true; doExportZip(); },
  "ocr-tgt"(a){ F.ocrTarget = a.dataset.k; a.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === a)); F.ocrAppend = false; },
  "ocr-chip"(a){ ocrApply(a.dataset.w); },
  "backup-now"(){ ZIP_SHARE = !!navigator.canShare; openOv(settingsHTML()); doExportZip(); },
  import(){ const i = $("#pick-import"); i.value = ""; i.click(); },
  "legacy-xml"(){ const i = $("#pick-xml"); i.value = ""; i.click(); },
  "legacy-photos"(){ const i = $("#pick-legacy"); i.value = ""; i.click(); }
};
document.addEventListener("click", e => {
  const a = e.target.closest("[data-a]"); if (!a) return;
  if (a.closest(".picker")) return;
  const sheet = a.closest(".sheet-bg");
  const h = H[a.dataset.a]; if (h) { e.preventDefault(); h(a, e); if (sheet) sheet.remove(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "search") { S.q = e.target.value; const g = $("#grid"); if (g) g.innerHTML = gridHTML(); return; }
  if (F && F.el && F.el.contains(e.target) && e.target.dataset.k) { F.touched.add(e.target.dataset.k); if (e.target.dataset.k === "name") dupCheck(); if (e.target.dataset.k === "ean") { const h = F.el.querySelector("#eanhint"); if (h) h.innerHTML = eanHint(e.target.value); dupCheck(); } }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { S.sort = e.target.value; const g = $("#grid"); if (g) g.innerHTML = gridHTML(); }
  else if (e.target.id === "set-country") saveSettings({defaultCountry:e.target.value});
  else if (e.target.id === "set-cur") saveSettings({currency:norm(e.target.value)});
  else if (e.target.id === "set-name") saveSettings({userName:norm(e.target.value).slice(0, 30), nameAsked:true});
  else if (F && F.el && F.el.contains(e.target) && e.target.dataset.k) F.touched.add(e.target.dataset.k);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const sh = document.querySelector(".sheet-bg"); if (sh) { sh.remove(); return; }
  if (stack.length) closeTop();
});
$("#pick-photo").addEventListener("change", e => { if (F && e.target.files.length) addPhotos([...e.target.files]); });
$("#pick-scan").addEventListener("change", async e => {
  const files = [...e.target.files]; if (!files.length || !pendingScan) return;
  const ps = pendingScan; pendingScan = null;
  if (!ps.inForm) openForm(ps.kind, null, ps.prefill);
  await addPhotos(files);
  runScan();
});
$("#pick-barcode").addEventListener("change", async e => {
  const file = e.target.files[0]; const ctx = bcCtx; bcCtx = null; if (!file || !ctx) return;
  toast(tr("Barcode wird gelesen …"));
  const code = await decodeBarcode(file);
  if (!code) { toast(tr("Kein Barcode erkannt. Näher heran und scharf fotografieren, oder die Nummer eintippen.")); return; }
  if (ctx.inForm) { if (F) { setEan(code); toast(tr("Barcode erkannt: {c}",{c:code})); } return; }
  barcodeSheet(code, ctx.kind || "beer");
});
$("#pick-xml").addEventListener("change", e => { const f = e.target.files[0]; if (f) legacyImport(f); });
$("#pick-legacy").addEventListener("change", e => { if (e.target.files.length) legacyPhotos([...e.target.files]); });
$("#pick-import").addEventListener("change", e => { const f = e.target.files[0]; if (f) doImport(f); });

/* ================= Start ================= */
const APP_VERSION = "1.3.1";
(async function init(){
  document.documentElement.lang = LOCALE;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = tr(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", tr(e.dataset.i18nAria)));
  render();
  try {
    IDB = await idbOpen();
    await photoInit();
    CAP.assets = { upload: async b => ({id: await putPhoto(b)}), delete: async id => delPhoto(id) };
    CAP.downloads = { save: saveFile };
    CAP.ocr = true;
    store = await idbStore();
  } catch(e) {
    store = localStore();
    toast(tr("Gerätespeicher nicht verfügbar – Daten werden nur vorübergehend gespeichert."));
  }
  store.subscribe(onData);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
